name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # public values by design (the same two names are set in Vercel; data is protected by row level security); needed so the cloud screens exist in the test build
      VITE_SUPABASE_URL: https://plbvgcnyfclillatpowc.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_6RuY0A4VTuxjHAAh9HVF0g_9ueL7nfF
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: MCP server offline tests
        run: |
          npm ci --prefix supabase/functions/docs-mcp
          node supabase/functions/docs-mcp/test.mjs
      - run: npm run build
      - run: npm run build:canvas
      - run: npx playwright-core install --with-deps chromium
      - name: Browser tests
        run: |
          export CHROME="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
          npx vite preview --host 127.0.0.1 --port 5198 &
          sleep 4
          export BASE=http://127.0.0.1:5198/
          node qa-merge.mjs
          node qa-auto.mjs
          node qa.mjs
          node check.mjs
          node qa-ai.mjs
          node qa-content.mjs
